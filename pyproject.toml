[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-simulator"
version = "1.0.0"
description = "A distributed system simulator for smart city sensor data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "pydantic==2.6.4",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "black==23.11.0",
    "mypy>=1.0.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
